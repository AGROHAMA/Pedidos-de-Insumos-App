<style>
:root{--g900:#183a1d;--g700:#276b32;--g600:#2f8a3c;--g100:#e7f5ea;--amber:#c9891f;--amber100:#fbf0dd;--red:#b3402c;--red100:#fbe7e2;--t900:#1f2421;--t700:#4b544d;--t400:#8a938c;--t200:#dfe6e1;--t100:#f3f6f4;--white:#fff;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--t100);color:var(--t900);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--g700);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}
.badge{background:var(--amber);color:#fff;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;border:0}

<script>
const K_PED='agrohama_pedidos_v2', K_REC='agrohama_recebimentos_v2', K_SET='agrohama_pedidos_settings_v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=n=>(Math.round(n*100)/100).toLocaleString('pt-BR');
const fm=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=iso=>{try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return ''}};
const fdate=v=>{if(!v)return '';const [y,m,d]=v.split('-');return `${d}/${m}/${y.slice(2)}`};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Memória do aparelho cheia. Copie o backup em Ajustes.');return false}};
const UNS=['kg','L','t','sc','un','cx','bag','ha'];
const PRODUTORES=['Koro Hamaguchi','Nilton Hamaguchi'];

let settings=Object.assign({nome:'',webhookUrl:'',webhookUrlRec:'',webhookUrlLista:''},load(K_SET,{}));
(function(){try{const m=location.hash.match(/^#cfg=(.+)$/);if(!m)return;const c=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(c&&(c.webhookUrl||c.webhookUrlLista)){settings=Object.assign(settings,c);save(K_SET,settings)}history.replaceState(null,'',location.pathname)}catch{}})();
let pedidos=load(K_PED,[]);
let recs=load(K_REC,[]);
let tab='pedidos', openId=null, foto=null, preselect='', pendentes=0, semFotoOk=false;

function toast(m,ms=4000){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}

/* ---------- fila offline (IndexedDB) ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('agrohama-pedidos-outbox',1);r.onupgradeneeded=()=>r.result.createObjectStore('outbox',{keyPath:'key'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('outbox',mode);const s=t.objectStore('outbox');const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)})}
const outPut=item=>tx('readwrite',s=>s.put(item));
const outDel=key=>tx('readwrite',s=>s.delete(key));
const outAll=()=>tx('readonly',s=>s.getAll());
async function contarPend(){try{pendentes=(await outAll()).length}catch{pendentes=0}badge()}
function badge(){const b=$('#sync');b.className='badge'+(pendentes?'':' ok');b.textContent=pendentes?`${pendentes} para enviar`:'Tudo enviado'}

let flushing=false;
async function flush(manual){
  if(flushing)return;
  if(!settings.webhookUrl){if(manual)toast('Cadastre o endereço do fluxo em Ajustes.');return}
  if(!navigator.onLine){if(manual)toast('Sem internet. O envio fica na fila.');return}
  flushing=true;
  try{
    const items=(await outAll()).sort((a,b)=>a.key.localeCompare(b.key));
    for(const it of items){
      let ok=false;
      const url=it.kind==='rec'?(settings.webhookUrlRec||''):settings.webhookUrl;
      if(!url){if(manual)toast('Falta cadastrar o endereço do fluxo de recebimento em Ajustes.',5000);break}
      try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:it.body});ok=r.ok}catch{ok=false}
      if(!ok){if(manual)toast('O envio falhou. Confira o endereço do fluxo e tente de novo.');break}
      await outDel(it.key);
      const list=it.kind==='pedido'?pedidos:recs; const x=list.find(y=>y.id===it.refId); if(x)x.synced=true;
    }
    save(K_PED,pedidos);save(K_REC,recs);
  }finally{flushing=false;await contarPend();renderBg()}
}

/* ---------- sincronização com o cadastro central ---------- */
let sincronizando=false;
function lerItemRemoto(x){
  try{
    if(x&&x.$content&&typeof x.$content==='string'){return JSON.parse(decodeURIComponent(escape(atob(x.$content))))}
    if(typeof x==='string')return JSON.parse(x);
  }catch{return null}
  return x;
}
async function sincronizar(manual){
  if(sincronizando)return;
  if(!settings.webhookUrlLista){if(manual)toast('Cadastre o endereço do fluxo de lista em Ajustes.');return}
  if(!navigator.onLine){if(manual)toast('Sem internet. Mostrando o que está salvo neste aparelho.');return}
  sincronizando=true;
  try{
    const r=await fetch(settings.webhookUrlLista,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if(!r.ok)throw new Error('http '+r.status);
    const arr=await r.json();
    let novos=0;
    for(const raw of (Array.isArray(arr)?arr:[])){
      const x=lerItemRemoto(raw);if(!x||!x.id||!x.codigo)continue;
      if(x.tipo){ if(!recs.some(y=>y.id===x.id)){recs.push({...x,synced:true});novos++} }
      else if(x.itens){ const l=pedidos.find(y=>y.id===x.id||y.codigo===x.codigo&&y.externo); if(!l){pedidos.push({...x,synced:true});novos++} else if(l.externo&&x.gerente){Object.assign(l,x,{externo:false,synced:true})} }
    }
    save(K_PED,pedidos);save(K_REC,recs);renderBg();
    if(manual)toast(novos?`${novos} novo(s) da rede.`:'Tudo em dia.');
  }catch(e){if(manual)toast('Não consegui atualizar a lista. Confira o endereço do fluxo de lista.',5000)}
  finally{sincronizando=false}
}
async function enfileirar(kind,refId,payload){
  const key=Date.now().toString().padStart(14,'0')+Math.random().toString(36).slice(2,5);
  await outPut({key,kind,refId,body:JSON.stringify(payload)});
  await contarPend(); flush(false);
}

/* ---------- regras ---------- */
const TIPO={unica:'NF única',mae:'NF mãe',filha:'NF filha'};
const totalPedido=p=>p.itens.reduce((a,i)=>a+i.qtd*(i.preco||0),0);
function recsDe(cod){return recs.filter(r=>r.codigo===cod).sort((a,b)=>a.em.localeCompare(b.em))}
function recebidoItem(p,idx){return recsDe(p.codigo).filter(r=>r.tipo!=='mae').reduce((a,r)=>a+(+(r.itens[idx]||0)),0)}
function saldoMaeItem(p,mae,idx){return (+(mae.itens[idx]||0))-recsDe(p.codigo).filter(r=>r.tipo==='filha'&&r.maeNf===mae.nf).reduce((a,r)=>a+(+(r.itens[idx]||0)),0)}
function status(p){
  if(p.encerrado)return['en','Encerrado'];
  const rc=p.itens.map((_,i)=>recebidoItem(p,i));
  if(rc.every(x=>!x))return['ag','Aguardando entrega'];
  if(p.itens.some((it,i)=>rc[i]<it.qtd))return['pa','Recebido parcial'];
  return['ok','Recebido completo'];
}
const linhaItem=i=>`${i.nome} ${fq(i.qtd)} ${i.un}${i.preco?` x ${fm(i.preco)} = ${fm(i.qtd*i.preco)}`:''}`;

function textoPedido(p){
  const topo=[p.fornecedor,[p.produtor,p.fazenda&&('fazenda '+p.fazenda)].filter(Boolean).join(', ')].filter(Boolean).join(': ');
  const tot=totalPedido(p);
  return `PEDIDO ${p.codigo}\n${topo}\n${p.itens.map(linhaItem).join('\n')}${tot?`\nTotal: ${fm(tot)}`:''}\n${[p.vencimento&&('Vencimento '+fdate(p.vencimento)),p.uso,p.prazo].filter(Boolean).join('. ')}${p.obs?`\nObs.: ${p.obs}`:''}\nPedido por ${p.gerente} em ${fd(p.criadoEm)}`;
}
function textoRec(p,r,resumo){
  return `RECEBIMENTO · ${p.codigo}\n${TIPO[r.tipo]} ${r.nf}${r.maeNf?` (da mãe ${r.maeNf})`:''}${r.fornecedor?` · ${r.fornecedor}`:''}\n${p.itens.map((it,i)=>(+r.itens[i]?`${it.nome}: ${fq(+r.itens[i])} ${it.un}`:null)).filter(Boolean).join('\n')}\nRecebido por ${r.por} em ${fd(r.em)}\n${resumo}`;
}
function resumoRec(p){return 'Situação: '+p.itens.map((it,i)=>`${it.nome} ${fq(recebidoItem(p,i))}/${fq(it.qtd)} ${it.un}`).join(' · ')}

function shrink(file,max=2600){return new Promise(res=>{const fr=new FileReader();fr.onerror=()=>res(null);fr.onload=()=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.9))};im.src=fr.result};fr.readAsDataURL(file)})}

const MAX_PDF=10*1024*1024;
function lerArquivo(file){return new Promise(res=>{if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){if(file.size>MAX_PDF){toast('PDF acima de 10 MB. Escaneie em qualidade menor.',5000);return res(null)}const fr=new FileReader();fr.onerror=()=>res(null);fr.onload=()=>res(String(fr.result).replace(/^data:[^;]*;/,'data:application/pdf;'));fr.readAsDataURL(file)}else shrink(file).then(res)})}

function renderBg(){if(tab==='pedidos'||tab==='recebidos')render()}
function render(){
  const dl=$('#dl-forn');if(dl&&!dl.children.length)dl.innerHTML=FORNECEDORES.map(n=>`<option value="${esc(n)}">`).join('');
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
  $('#app').innerHTML={pedidos:()=>vPedidos(false),recebidos:()=>vPedidos(true),novo:vNovo,receber:vReceber,ajustes:vAjustes}[tab]();
  if(tab==='novo'&&!$('#itens .it'))addItem();
}
const unOpts=sel=>UNS.map(u=>`<option ${u===sel?'selected':''}>${u}</option>`).join('');
function vPedidos(hist){
  const fim=p=>{const c=status(p)[0];return c==='ok'||c==='en'};
  const l=[...pedidos].filter(p=>hist?fim(p):!fim(p)).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));
  if(!l.length)return hist?`<div class="empty">Nenhum pedido recebido por completo ainda.<br>Quando todos os itens chegarem, o pedido vem para cá.</div>`:`<div class="empty">Nenhum pedido em aberto.<br>Toque em <b>Novo</b> para fazer um pedido.</div>`;
  return l.map(p=>{const [c,t]=status(p),rs=recsDe(p.codigo),open=openId===p.id,tot=totalPedido(p);
    const maes=rs.filter(r=>r.tipo==='mae');
    return `<div class="card"><div data-open="${p.id}" style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><span class="title">${esc(p.itens.map(i=>i.nome).join(' + '))}</span><span class="pill p-${c}">${t}</span></div>
      <div class="muted">${esc([p.produtor,p.fazenda,p.fornecedor].filter(Boolean).join(' · '))}</div>
      <div class="code">${esc(p.codigo)} · ${esc(p.gerente)} · ${fd(p.criadoEm)}${p.synced?'':' · <b style="color:var(--amber)">não enviado</b>'}</div>
      ${p.itens.map((it,i)=>{const rc=recebidoItem(p,i);return `<div class="muted">${esc(it.nome)}: ${fq(rc)} de ${fq(it.qtd)} ${esc(it.un)}</div><div class="bar"><i style="width:${Math.min(100,it.qtd?rc/it.qtd*100:0)}%"></i></div>`}).join('')}
      ${tot?`<div class="small">Total do pedido ${fm(tot)}${p.vencimento?` · vence ${fdate(p.vencimento)}`:''}${p.prazo?` · ${esc(p.prazo)}`:''}</div>`:''}</div>
      ${open?`${p.uso?`<div class="muted">Uso: ${esc(p.uso)}</div>`:''}${p.obs?`<div class="muted">Obs.: ${esc(p.obs)}</div>`:''}
      ${maes.map(m=>`<div class="saldo"><b>NF mãe ${esc(m.nf)}</b><br>${p.itens.map((it,i)=>+m.itens[i]?`${esc(it.nome)}: total ${fq(+m.itens[i])} · saldo <b>${fq(saldoMaeItem(p,m,i))}</b> ${esc(it.un)}`:'').filter(Boolean).join('<br>')}</div>`).join('')}
      ${rs.map(r=>`<div class="line"><b>${esc(r.nf)}</b> · ${TIPO[r.tipo]}${r.maeNf?` da mãe ${esc(r.maeNf)}`:''}<br>${p.itens.map((it,i)=>+r.itens[i]?`${esc(it.nome)} ${fq(+r.itens[i])} ${esc(it.un)}`:'').filter(Boolean).join(' · ')}<br><span class="small">${esc(r.fornecedor||'sem fornecedor')} · ${esc(r.por)} · ${fd(r.em)}${r.synced?'':' · não enviado'}</span></div>`).join('')}
      <div class="row"><button class="btn sec" data-receber="${esc(p.codigo)}">Receber NF</button>${p.encerrado?'':`<button class="btn ghost" data-encerrar="${p.id}">Encerrar</button>`}</div>`:''}
    </div>`}).join('');
}

function vReceber(){

  <div class="small" id="r-integral">NF integral: o app dá baixa em todos os itens que ainda faltam neste pedido. Não precisa digitar quantidade.</div>
  <div id="r-itens" style="display:flex;flex-direction:column;gap:10px" hidden>${recItens(p0)}</div>
  <label>Tirar foto da NF agora (não fica salva no celular)<input id="r-foto" type="file" accept="image/*" capture="environment"></label>
  <label>Ou anexar um arquivo (PDF escaneado ou foto da galeria)<input id="r-arq" type="file" accept="image/*,application/pdf,.pdf"></label>
  <img class="prev" id="r-prev" alt="" hidden>
  <div class="chip" id="r-chip" hidden></div>
  <button class="btn" type="submit">Salvar recebimento</button></form>`;
}
function vAjustes(){
  setTimeout(()=>{const b=$('#b-inst');if(b&&window._inst){b.hidden=false}},0);
  return `<form class="card" id="fSet">
  <label>Seu nome<input id="s-nome" value="${esc(settings.nome)}" autocomplete="name"></label>
  <label>Endereço do fluxo de PEDIDO<textarea id="s-url" placeholder="https://prod-…logic.azure.com/…">${esc(settings.webhookUrl)}</textarea></label>
  <label>Endereço do fluxo de RECEBIMENTO<textarea id="s-url2" placeholder="https://prod-…logic.azure.com/…">${esc(settings.webhookUrlRec)}</textarea></label>
  <label>Endereço do fluxo de LISTA (sincroniza os aparelhos)<textarea id="s-url3" placeholder="https://prod-…logic.azure.com/…">${esc(settings.webhookUrlLista)}</textarea></label>
  <button class="btn" type="submit">Salvar ajustes</button>
  <div class="row"><button class="btn sec" type="button" id="b-teste">Enviar teste</button><button class="btn sec" type="button" id="b-flush">Enviar pendências agora</button></div>
  <button class="btn" type="button" id="b-inst" hidden>📲 Instalar app neste aparelho</button>
  <div class="small" id="inst-ajuda">Para instalar: no Chrome, menu ⋮ › "Instalar app" (ou "Adicionar à tela inicial"). No iPhone: Safari › Compartilhar › "Adicionar à Tela de Início".</div>
  <button class="btn ghost" type="button" id="b-link">Copiar link de configuração (para outro aparelho/navegador)</button>
  <button class="btn ghost" type="button" id="b-exp">Copiar backup dos dados</button>
  <div class="small">Os pedidos ficam guardados neste aparelho. Sem internet, o envio entra na fila e sai sozinho quando a rede volta.</div></form>`;
}

/* ---------- eventos ---------- */
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;foto=null;render();scrollTo(0,0)}});
$('#sync').addEventListener('click',async()=>{await flush(true);sincronizar(true)});
document.addEventListener('click',async e=>{
  const o=e.target.closest('[data-open]');if(o){openId=openId===o.dataset.open?null:o.dataset.open;render();return}
  const r=e.target.closest('[data-receber]');if(r){preselect=r.dataset.receber;tab='receber';foto=null;render();scrollTo(0,0);return}
  const en=e.target.closest('[data-encerrar]');if(en){const p=pedidos.find(x=>x.id===en.dataset.encerrar);if(p){p.encerrado=true;save(K_PED,pedidos);render();toast('Pedido encerrado.')}return}
  if(e.target.closest('[data-rmitem]')){const it=e.target.closest('.it');if(document.querySelectorAll('#itens .it').length>1)it.remove();return}
  if(e.target.id==='b-additem')addItem();
  if(e.target.id==='b-flush')flush(true);
  if(e.target.id==='b-teste'){if(!settings.webhookUrl)return toast('Cadastre o endereço do fluxo primeiro.');await enfileirar('teste','',{evento:'teste',texto:`Teste do app de pedidos, enviado por ${settings.nome||'sem nome'} em ${fd(new Date().toISOString())}.`,registro:{}});toast('Teste na fila de envio.')}
  if(e.target.id==='b-inst'&&window._inst){window._inst.prompt();await window._inst.userChoice;window._inst=null;render()}
  if(e.target.id==='b-link'){const c=btoa(unescape(encodeURIComponent(JSON.stringify(settings))));const u=location.origin+location.pathname+'#cfg='+c;try{await navigator.clipboard.writeText(u);toast('Link copiado. Contém os endereços dos fluxos: mande só para quem é da equipe.',5000)}catch{prompt('Copie o link:',u)}}
  if(e.target.id==='b-exp'){try{await navigator.clipboard.writeText(JSON.stringify({pedidos,recs},null,1));toast('Backup copiado.')}catch{toast('Não foi possível copiar.')}}
});
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='n-prd')$('#n-prd-o-w').hidden=e.target.value!=='__o';
  if(id==='r-ped'){$('#r-outro').hidden=e.target.value!=='__outro';const p=pedidos.find(x=>x.codigo===e.target.value);$('#r-itens').innerHTML=recItens(e.target.value==='__outro'?null:p);if(p)$('#r-forn').value=p.fornecedor||''}
  if(id==='r-tipo'){$('#r-mae-w').hidden=e.target.value!=='filha';const ui=e.target.value==='unica';$('#r-itens').hidden=ui;$('#r-integral').hidden=!ui}
  if(id==='n-foto'||id==='r-foto'||id==='r-arq'){const f=e.target.files[0];foto=f?await lerArquivo(f):null;const pv=$(id==='n-foto'?'#n-prev':'#r-prev');const ch=$(id==='n-foto'?'#n-chip':'#r-chip');if(f){ch.hidden=false;ch.className='chip'+(foto?' ok':' err');ch.textContent=foto?('✔ Anexado: '+(f.name||'foto')+' ('+Math.max(1,Math.round(f.size/1024))+' KB)'):('✖ Não anexou: '+(f.name||'arquivo')+'. Tente de novo ou use outro arquivo.')}else ch.hidden=true;if(foto&&foto.startsWith('data:image')){pv.src=foto;pv.hidden=false}else{pv.hidden=true;if(foto)toast('PDF anexado: '+f.name+'. Se esse arquivo está no celular, apague depois de salvar.',4000)}if(foto&&foto.startsWith('data:image')&&id==='r-arq')toast('Imagem pronta. Se ela está na galeria, apague depois de salvar.',4000);if(f&&!foto&&f.size<=MAX_PDF)toast('Não consegui ler esse arquivo. Tente de novo.')}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='fSet'){settings={nome:$('#s-nome').value.trim(),webhookUrl:$('#s-url').value.trim(),webhookUrlRec:$('#s-url2').value.trim(),webhookUrlLista:$('#s-url3').value.trim()};save(K_SET,settings);toast('Ajustes salvos.');flush(false).then(()=>sincronizar(true))}
  if(id==='fNovo'){
    const itens=[...document.querySelectorAll('#itens .it')].map(r=>({nome:$('.i-nome',r).value.trim(),qtd:parseFloat($('.i-qtd',r).value),un:$('.i-un',r).value,preco:parseFloat($('.i-preco',r).value)||0})).filter(i=>i.nome);
    if(!itens.length||itens.some(i=>!(i.qtd>0)))return toast('Cada item precisa de produto e quantidade.');
    const d=new Date(),p2=n=>String(n).padStart(2,'0'),rnd=Math.random().toString(36).slice(2,4).toUpperCase();
    const prd=$('#n-prd').value==='__o'?$('#n-prd-o').value.trim():$('#n-prd').value;
    const p={id:'p'+Date.now(),codigo:`P-${p2(d.getDate())}${p2(d.getMonth()+1)}-${p2(d.getHours())}${p2(d.getMinutes())}-${rnd}`,gerente:$('#n-ger').value.trim(),produtor:prd,fazenda:$('#n-faz').value.trim(),fornecedor:$('#n-forn').value.trim(),itens,vencimento:$('#n-venc').value,prazo:$('#n-prazo').value.trim(),uso:$('#n-uso').value.trim(),obs:$('#n-obs').value.trim(),criadoEm:d.toISOString(),encerrado:false,synced:false};
    settings.nome=p.gerente;save(K_SET,settings);pedidos.push(p);save(K_PED,pedidos);
    await enfileirar('pedido',p.id,{evento:'pedido_novo',texto:textoPedido(p),registro:{...p,total:totalPedido(p),foto}});
    foto=null;openId=p.id;tab='pedidos';render();toast(settings.webhookUrl?'Pedido salvo e na fila de envio.':'Pedido salvo. Cadastre o endereço do fluxo em Ajustes para enviar.');
  }
  if(id==='fRec'){
    let cod=$('#r-ped').value,p;
    if(cod==='__outro'){cod=$('#o-cod').value.trim().toUpperCase();const nome=$('#o-prod').value.trim();if(!cod||!nome)return toast('Informe o código e o produto do pedido.');
      p=pedidos.find(x=>x.codigo===cod)||{id:'p'+Date.now(),codigo:cod,gerente:'',produtor:'',fazenda:'',fornecedor:'',itens:[{nome,qtd:parseFloat($('#o-qtd').value)||0,un:$('#o-un').value,preco:0}],criadoEm:new Date().toISOString(),encerrado:false,synced:true,externo:true};
      if(!pedidos.includes(p)){pedidos.push(p);save(K_PED,pedidos)}}
    else p=pedidos.find(x=>x.codigo===cod);
    const tipo=$('#r-tipo').value,nf=$('#r-nf').value.trim(),maeNf=tipo==='filha'?$('#r-mae').value.trim():'';
    const itens=tipo==='unica'?p.itens.map((it,i)=>Math.max(0,+(it.qtd||0)-recebidoItem(p,i))):p.itens.map((_,i)=>{const el=document.querySelector(`.r-q[data-i="${i}"]`);return el?(parseFloat(el.value)||0):0});
    if(p.externo&&p.itens.length===1&&!document.querySelector('.r-q')){}
    if(!nf)return toast('Informe o número da NF.');
    if(!itens.some(x=>x>0))return toast(tipo==='unica'?'Esse pedido já está todo recebido (ou sem quantidade pedida). Use NF mãe/filha e digite as quantidades.':'Informe a quantidade de pelo menos um item.');
    if(tipo==='filha'&&!maeNf)return toast('Informe o número da NF mãe.');
    if(!foto&&!semFotoOk){semFotoOk=true;return toast('Sem foto da NF. Toque em Salvar de novo para salvar assim mesmo.',5000)}
    semFotoOk=false;
    const r={id:'r'+Date.now(),codigo:p.codigo,tipo,nf,maeNf,fornecedor:$('#r-forn').value.trim(),itens,por:$('#r-por').value.trim(),em:new Date().toISOString(),synced:false};
    settings.nome=r.por;save(K_SET,settings);recs.push(r);save(K_REC,recs);
    const saldos=(tipo==='mae'||tipo==='filha')?(()=>{const m=recsDe(p.codigo).find(x=>x.tipo==='mae'&&x.nf===(tipo==='mae'?nf:maeNf));return m?p.itens.map((it,i)=>({item:it.nome,saldo:saldoMaeItem(p,m,i)})):null})():null;
    const resumo=resumoRec(p)+(saldos?`\nSaldo da NF mãe ${tipo==='mae'?nf:maeNf}: `+saldos.filter((s,i)=>true).map(s=>`${s.item} ${fq(s.saldo)}`).join(' · '):'');
    await enfileirar('rec',r.id,{evento:'recebimento',texto:textoRec(p,r,resumo),registro:{...r,foto,saldoMae:saldos}});
    foto=null;preselect='';openId=p.id;tab='pedidos';render();toast('Recebimento salvo e na fila de envio.');
  }
});

window.addEventListener('online',()=>{flush(false);sincronizar(false)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){flush(false);sincronizar(false)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._inst=e;if(tab==='ajustes')render()});
window.addEventListener('appinstalled',()=>{window._inst=null;toast('App instalado! Use o ícone na tela inicial.',5000)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
contarPend().then(()=>{render();flush(false).then(()=>sincronizar(false))});
</script>
</body>
</html>
